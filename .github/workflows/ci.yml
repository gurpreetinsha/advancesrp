name: SRGC Portal CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/srgc_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/srgc_test
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production-123456
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srgc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srgc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
